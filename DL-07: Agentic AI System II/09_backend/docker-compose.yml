# docker-compose.yml — prepared for running the whole system in Docker (not used yet; currently run locally with web_agent_predic.bat)
#
# Future usage (run from the project root):
#   docker compose -f 09_backend/docker-compose.yml up -d --build
#   Web page: http://localhost:3000     API docs: http://localhost:8000/docs
#   Stop:     docker compose -f 09_backend/docker-compose.yml down
#
# Only 2 ports are published (web 3000 and API 8000); the other services talk on Docker's internal network

name: proj7-agent2

x-python-service: &python-service
  restart: unless-stopped
  env_file:
    - path: .env.docker
    - path: ../.env          # optional: free Llama API key (LLM_API_KEY)
      required: false
  networks: [internal]

services:
  web_app:
    build: { context: .., dockerfile: 01_web_app/Dockerfile }
    ports: ["3000:80"]
    depends_on: [api_backend]
    restart: unless-stopped
    networks: [internal]

  api_backend:
    <<: *python-service
    build: { context: .., dockerfile: 02_api_/Dockerfile }
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      travel_ai_agent: { condition: service_healthy }
      data_integration: { condition: service_healthy }
      recommendation_feedback: { condition: service_healthy }

  travel_ai_agent:
    <<: *python-service
    build: { context: .., dockerfile: 03_travel_ai_agent/Dockerfile }
    depends_on:
      external_data_services: { condition: service_healthy }
      data_integration: { condition: service_healthy }
      risk_knowledge_services: { condition: service_healthy }
      decision_llm_engine: { condition: service_healthy }
      recommendation_feedback: { condition: service_healthy }

  external_data_services:
    <<: *python-service
    build: { context: .., dockerfile: 04_external_data_services/Dockerfile }

  data_integration:
    <<: *python-service
    build: { context: .., dockerfile: 05_data_integration/Dockerfile }
    volumes: ["snapshots:/app/05_data_integration/data"]
    depends_on:
      external_data_services: { condition: service_healthy }

  risk_knowledge_services:
    <<: *python-service
    build: { context: .., dockerfile: 06_risk_knowledge_services/Dockerfile }

  decision_llm_engine:
    <<: *python-service
    build: { context: .., dockerfile: 07_decision_llm_engine/Dockerfile }
    volumes: ["decisions:/app/07_decision_llm_engine/data"]

  recommendation_feedback:
    <<: *python-service
    build: { context: .., dockerfile: 08_recommendation_feedback/Dockerfile }
    volumes: ["feedback:/app/08_recommendation_feedback/data"]
    depends_on:
      data_integration: { condition: service_healthy }

networks:
  internal: {}

volumes:
  snapshots: {}
  decisions: {}
  feedback: {}
